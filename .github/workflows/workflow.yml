name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: "要构建的 commit / tag（留空 = 触发时的分支 head）"
        required: false
        default: ""
      backfill:
        description: "同时补建 1.1.0-1.5.0 的历史 release"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".github/workflows/backfill.yml"

# The default token is read-only on new repositories, and publishing a release
# needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_dispatch with build_ref rebuilds an older commit using the
          # current workflow.
          ref: ${{ inputs.build_ref || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version and target commit
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content PowerDimmer.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $v) { throw "PowerDimmer.csproj has no <Version>; refusing to publish an unversioned build." }
          $sha = (git rev-parse HEAD).Trim()
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$v"    | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha=$sha"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version=$v tag=v$v sha=$sha"

      # One release per version, so a version that has already been published can
      # never be silently overwritten with different code:
      #   - same commit      -> rebuild, refresh the assets only
      #   - docs / CI only   -> nothing to publish, succeed quietly
      #   - code changed     -> fail, the version number has to be bumped
      - name: Guard against reusing a published version
        id: guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.tag }}
          SHA: ${{ steps.ver.outputs.sha }}
        run: |
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = "${{ github.repository }}"
          try {
            $ref = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/git/ref/tags/$env:TAG"
          } catch {
            if ([int]$_.Exception.Response.StatusCode -eq 404) {
              Write-Host "tag $env:TAG does not exist yet; it will be created at $env:SHA"
              exit 0
            }
            throw
          }

          $published = $ref.object.sha
          if ($ref.object.type -eq "tag") {
            $published = (Invoke-RestMethod -Headers $headers -Uri $ref.object.url).object.sha
          }
          Write-Host "tag $env:TAG already exists at $published"

          if ($published -eq $env:SHA) {
            Write-Host "same commit as the published release; refreshing assets only"
            exit 0
          }

          $cmp = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$repo/compare/$published...$env:SHA"
          $codeChanges = @($cmp.files | Where-Object {
            $_.filename -notmatch '\.md$' -and $_.filename -notmatch '^\.github/workflows/'
          })
          if ($codeChanges.Count -gt 0) {
            $list = ($codeChanges | ForEach-Object { $_.filename }) -join ', '
            throw "$env:TAG is already published from $published, but this build changes: $list. Bump <Version> in PowerDimmer.csproj."
          }

          Write-Host "only docs / workflow files changed since $env:TAG; nothing to publish"
          "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Package layout (deliberately mirrors what most portable Windows apps ship):
      #
      #   PowerDimmer_1.1.0_x64-portable.zip
      #     └─ PowerDimmer/            <- folder name has NO version, so unzipping a
      #        ├─ PowerDimmer.exe         newer build over an existing folder merges
      #        ├─ ...                     into the same directory instead of creating
      #        └─ settings.json           a second copy next to the old one
      #
      # settings.json / crash.log are generated at run time and must never be in the
      # archive: they live inside that same folder, and an "upgrade" would wipe them.
      - name: Build packages
        id: pack
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "PowerDimmer"

          function Assert-NoUserData([string]$dir) {
            foreach ($bad in @("settings.json", "settings.json.new", "crash.log")) {
              if (Test-Path (Join-Path $dir $bad)) {
                throw "Refusing to package: $bad found in $dir"
              }
            }
            Write-Host "--- contents of $dir ---"
            Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          }

          function Assert-Archive([string]$zip) {
            $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            $names = $a.Entries | ForEach-Object { $_.FullName }
            $a.Dispose()

            Write-Host "--- $zip ---"
            $names | ForEach-Object { Write-Host "   $_" }

            $outside = $names | Where-Object { -not $_.StartsWith("$folder/") }
            if ($outside) { throw "$zip has entries outside $folder/: $($outside[0])" }
            if ($names -notcontains "$folder/PowerDimmer.exe") { throw "$zip has no $folder/PowerDimmer.exe" }

            $userData = $names | Where-Object { $_ -match '(^|/)(settings\.json|settings\.json\.new|crash\.log)$' }
            if ($userData) { throw "$zip contains user data: $($userData[0])" }
          }

          dotnet publish -c Release -r win-x64 --self-contained true -o "stage-portable/$folder"
          Assert-NoUserData "stage-portable/$folder"
          $portable = "PowerDimmer_$($env:VERSION)_x64-portable.zip"
          Compress-Archive -Path "stage-portable/$folder" -DestinationPath $portable -Force
          Assert-Archive $portable

          dotnet publish -c Release -o "stage-light/$folder"
          Assert-NoUserData "stage-light/$folder"
          $light = "PowerDimmer_$($env:VERSION)_x64-requires-dotnet8.zip"
          Compress-Archive -Path "stage-light/$folder" -DestinationPath $light -Force
          Assert-Archive $light

          "portable_zip=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "light_zip=$light" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Release notes live in CHANGELOG.md under "## [<version>]"; the section is
      # copied verbatim so the repo and the Releases page never drift apart.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        if: steps.guard.outputs.skip != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if (-not (Test-Path CHANGELOG.md)) {
            throw "CHANGELOG.md is missing; every release needs a changelog entry."
          }
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[?v?$([regex]::Escape($env:VERSION))\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) {
            throw "CHANGELOG.md has no '## [$env:VERSION]' section. Add one before releasing."
          }
          $notes = $m.Groups[1].Value.Trim()
          "notes<<CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host $notes

      - uses: softprops/action-gh-release@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ steps.ver.outputs.sha }}
          # Backfilling an old version through workflow_dispatch must not steal the
          # "Latest" badge from the newest release.
          make_latest: ${{ github.event_name == 'push' && 'true' || 'false' }}
          body: |
            ${{ steps.notes.outputs.notes }}

            ---

            **${{ steps.pack.outputs.portable_zip }}** — 自包含，不需要装 .NET。解压后运行 `PowerDimmer\PowerDimmer.exe`。
            **${{ steps.pack.outputs.light_zip }}** — 体积小，需要 [.NET 8 桌面运行时](https://dotnet.microsoft.com/en-us/download/dotnet/8.0)。

            两个包解开后都只有一个 `PowerDimmer` 文件夹（名字不带版本号）。升级时先退出程序，再把新包解压覆盖旧文件夹 —— `settings.json` 不参与打包，配置会保留。

            版本号显示在托盘菜单 `设置 → 关于 PowerDimmer`，以及 exe 的「属性 → 详细信息」页。
          files: |
            ${{ steps.pack.outputs.portable_zip }}
            ${{ steps.pack.outputs.light_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One-off backfill of the versions that were published while there was still a
  # single rolling "latest" release. Triggered by putting [backfill] in the commit
  # message, so it does not run on ordinary pushes.
  #
  # It lives here rather than in its own workflow because a separate workflow file
  # got a token with every permission false (even `pull`), so POST /git/refs and
  # POST /releases both returned 403 - while this file's token can write fine.
  backfill:
    # Two ways in: a commit message containing [backfill], or ticking the
    # "backfill" box when running this workflow manually from the Actions page.
    # An empty commit would not do: path filters ignore commits with no file
    # changes, so nothing would start at all.
    if: ${{ inputs.backfill == true || contains(github.event.head_commit.message || '', '[backfill]') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - version: "1.1.0"
            ref: "21e699f3569cdef109bc61e2275ea70dd561c486"
          - version: "1.2.0"
            ref: "796af6ae38764eb29673a1668de1f033aae9ea9f"
          - version: "1.3.0"
            ref: "ac57a517e25a328a8c96b9eb86baa286a1113845"
          - version: "1.3.1"
            ref: "695c6c7dbc58c8f25bb2b4b7ddfb94fa23c0f029"
          - version: "1.4.0"
            ref: "4dc2cd38f90b07534b09ff7a1b70f724d5959978"
          - version: "1.4.1"
            ref: "42ff0f441a54dbc5de97942d77a2bf5fd1a94de2"
          - version: "1.4.2"
            ref: "6cb7c9aa25cdaa8113c15d7423a6e4f8d5c1c4ec"
          - version: "1.5.0"
            ref: "fe26c41d0103906cbfc4d2c62d2e5b115eeb6520"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The checked-out commit predates CHANGELOG.md, so read it from the branch
      # that has it. Raw content can be a few seconds behind a fresh push.
      - name: Fetch CHANGELOG from the default branch
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-RestMethod -Uri $url -OutFile CHANGELOG.md
              if ((Get-Item CHANGELOG.md).Length -gt 1000) { break }
            } catch {
              Write-Host "attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 6
          }
          if (-not (Test-Path CHANGELOG.md) -or (Get-Item CHANGELOG.md).Length -lt 1000) {
            throw "could not fetch CHANGELOG.md from main"
          }
          Write-Host "CHANGELOG.md: $((Get-Item CHANGELOG.md).Length) bytes"

      - name: Build packages
        id: pack
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "PowerDimmer"

          function Assert-NoUserData([string]$dir) {
            foreach ($bad in @("settings.json", "settings.json.new", "crash.log")) {
              if (Test-Path (Join-Path $dir $bad)) {
                throw "Refusing to package: $bad found in $dir"
              }
            }
          }

          function Assert-Archive([string]$zip) {
            $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            $names = $a.Entries | ForEach-Object { $_.FullName }
            $a.Dispose()
            $outside = $names | Where-Object { -not $_.StartsWith("$folder/") }
            if ($outside) { throw "$zip has entries outside $folder/: $($outside[0])" }
            if ($names -notcontains "$folder/PowerDimmer.exe") { throw "$zip has no $folder/PowerDimmer.exe" }
            $userData = $names | Where-Object { $_ -match '(^|/)(settings\.json|settings\.json\.new|crash\.log)$' }
            if ($userData) { throw "$zip contains user data: $($userData[0])" }
          }

          dotnet publish -c Release -r win-x64 --self-contained true -o "stage-portable/$folder"
          Assert-NoUserData "stage-portable/$folder"
          $portable = "PowerDimmer_$($env:VERSION)_x64-portable.zip"
          Compress-Archive -Path "stage-portable/$folder" -DestinationPath $portable -Force
          Assert-Archive $portable

          dotnet publish -c Release -o "stage-light/$folder"
          Assert-NoUserData "stage-light/$folder"
          $light = "PowerDimmer_$($env:VERSION)_x64-requires-dotnet8.zip"
          Compress-Archive -Path "stage-light/$folder" -DestinationPath $light -Force
          Assert-Archive $light

          "portable_zip=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "light_zip=$light" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Job logs need authentication to read, annotations do not. Everything the
      # publish path needs to explain itself is therefore emitted as ::warning::
      # so it can be read from the check-run annotations afterwards.
      - name: Prepare release notes
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          REF: ${{ matrix.ref }}
          PORTABLE: ${{ steps.pack.outputs.portable_zip }}
          LIGHT: ${{ steps.pack.outputs.light_zip }}
        run: |
          $ErrorActionPreference = "Stop"

          $repo = "${{ github.repository }}"
          $tag = "v$($env:VERSION)"
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          Write-Host "::warning::diag $tag token length=$($env:GH_TOKEN.Length)"
          try {
            $info = Invoke-RestMethod -Headers $headers -Uri $api
            Write-Host "::warning::diag $tag repo permissions=$($info.permissions | ConvertTo-Json -Compress)"
          } catch {
            Write-Host "::warning::diag $tag GET repos HTTP $([int]$_.Exception.Response.StatusCode)"
          }

          # Create the tag up front so the release hangs off an exact commit
          # instead of whatever the branch head happens to be.
          try {
            Invoke-RestMethod -Headers $headers -Uri "$api/git/ref/tags/$tag" | Out-Null
            Write-Host "tag $tag already exists"
          } catch {
            if ([int]$_.Exception.Response.StatusCode -eq 404) {
              $payload = @{ ref = "refs/tags/$tag"; sha = $env:REF } | ConvertTo-Json
              try {
                Invoke-RestMethod -Method Post -Headers $headers -Body $payload `
                  -ContentType "application/json" -Uri "$api/git/refs" | Out-Null
                Write-Host "tag $tag created at $env:REF"
              } catch {
                Write-Host "::warning::diag $tag POST git/refs HTTP $([int]$_.Exception.Response.StatusCode) body=[$($_.ErrorDetails.Message)]"
              }
            }
          }

          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[?v?$([regex]::Escape($env:VERSION))\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "CHANGELOG.md has no '## [$($env:VERSION)]' section" }
          $notes = (($m.Groups[1].Value.Trim() -replace '(?m)^\s*---\s*$', '') -split "`r?`n" | ForEach-Object { $_.TrimEnd() }) -join "`n"
          $notes = $notes.Trim()

          $short = $env:REF.Substring(0, 7)
          $body = @(
            ('> 本版本为补建发布：当时按滚动方式发布，包已被覆盖；这里从对应提交 `' + $short + '` 重新构建。')
            ''
            $notes
            ''
            '---'
            ''
            ('**' + $env:PORTABLE + '** — 自包含，不需要装 .NET。解压后运行 `PowerDimmer\PowerDimmer.exe`。')
            ('**' + $env:LIGHT + '** — 体积小，需要 [.NET 8 桌面运行时](https://dotnet.microsoft.com/en-us/download/dotnet/8.0)。')
          ) -join "`n"

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "body<<BODY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "BODY_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Same action the normal release path uses; it is the one proven to hold
      # write access in this workflow.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          target_commitish: ${{ matrix.ref }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            ${{ steps.pack.outputs.portable_zip }}
            ${{ steps.pack.outputs.light_zip }}
          draft: false
          prerelease: false
          # A backfilled version must never take the "Latest" badge.
          make_latest: "false"
