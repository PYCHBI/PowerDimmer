name: Build and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"

# The default token is read-only on new repositories, and publishing a release
# needs write access to repository contents. Without this the old
# "update-tag" step failed with 403 and the release step was skipped.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read version from csproj
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content PowerDimmer.csproj
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if (-not $v) { $v = "0.0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Build portable + lightweight zips
        shell: pwsh
        run: |
          # The portable package is meant to be unzipped straight over an existing
          # install, so:
          #  * archive entries must sit at the zip root (no "portable/" prefix), and
          #  * nothing user-generated (settings.json, crash.log) may be inside, or an
          #    "upgrade" would silently wipe the user's config.
          function Assert-Clean([string]$dir) {
            foreach ($bad in @("settings.json", "settings.json.new", "crash.log")) {
              if (Test-Path (Join-Path $dir $bad)) {
                throw "Refusing to package: $bad found in $dir"
              }
            }
            Write-Host "--- contents of $dir ---"
            Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          }

          dotnet publish -c Release -r win-x64 --self-contained true -o portable
          Assert-Clean portable
          Compress-Archive -Path "portable/*" -DestinationPath "PowerDimmer-portable.zip" -Force
          Remove-Item -Recurse -Force portable

          dotnet publish -c Release -o lightweight
          Assert-Clean lightweight
          Compress-Archive -Path "lightweight/*" -DestinationPath "PowerDimmer-requires-dotnet8.zip" -Force
          Remove-Item -Recurse -Force lightweight

          Write-Host "--- zip listings ---"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($zip in @("PowerDimmer-portable.zip", "PowerDimmer-requires-dotnet8.zip")) {
            $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            $names = $a.Entries | ForEach-Object { $_.FullName }
            $a.Dispose()

            Write-Host "$zip :"
            $names | ForEach-Object { Write-Host ("   " + $_) }

            # Unzipping over an existing install only works if the files sit at the
            # archive root. A "portable/" prefix would bury them in a subfolder.
            $nested = $names | Where-Object { $_ -match "/" }
            if ($nested) { throw "$zip contains a folder prefix: $($nested -join ', ')" }
            if ($names -notcontains "PowerDimmer.exe") { throw "$zip has no PowerDimmer.exe at its root" }
            if ($names -contains "settings.json") { throw "$zip contains settings.json - an upgrade would wipe user config" }
            if ($names -contains "crash.log") { throw "$zip contains crash.log" }
          }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build (v${{ steps.ver.outputs.version }})
          body: |
            **PowerDimmer-portable.zip** — Self-contained, no .NET required. Just extract and run.
            **PowerDimmer-requires-dotnet8.zip** — Smaller download, requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/en-us/download/dotnet/8.0) installed.

            Version is shown in the About window (tray menu → 设置 → 关于 PowerDimmer) and in the exe's Properties → Details page.
          files: |
            PowerDimmer-portable.zip
            PowerDimmer-requires-dotnet8.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
