name: Backfill historical releases

# One-off: versions published before releases became one-per-version only ever
# existed as assets on the rolling "latest" release, so their packages were
# pruned away. This rebuilds each of them from its own commit and publishes it
# as v<version>, so the Releases page keeps a complete, downloadable history.
#
# Keep this file for future use - it is excluded from the main workflow's push
# trigger, so editing it never restarts a release build.

on:
  push:
    paths:
      - ".github/workflows/backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # Temporarily a single entry: the publish step needs to be proven first,
          # and one build is 8 minutes instead of 24. Add the rest back once green.
          - version: "1.1.0"
            ref: "21e699f3569cdef109bc61e2275ea70dd561c486"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The checked-out commit predates CHANGELOG.md, so read it from the branch
      # that has it. Raw content can be a few seconds behind a fresh push.
      - name: Fetch CHANGELOG from the default branch
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-RestMethod -Uri $url -OutFile CHANGELOG.md
              if ((Get-Item CHANGELOG.md).Length -gt 1000) { break }
            } catch {
              Write-Host "attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 6
          }
          if (-not (Test-Path CHANGELOG.md) -or (Get-Item CHANGELOG.md).Length -lt 1000) {
            throw "could not fetch CHANGELOG.md from main"
          }
          Write-Host "CHANGELOG.md: $((Get-Item CHANGELOG.md).Length) bytes"

      # Same packaging rules as the main workflow: one PowerDimmer/ folder whose
      # name carries no version, and no user data inside the archive.
      - name: Build packages
        id: pack
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "PowerDimmer"

          function Assert-NoUserData([string]$dir) {
            foreach ($bad in @("settings.json", "settings.json.new", "crash.log")) {
              if (Test-Path (Join-Path $dir $bad)) {
                throw "Refusing to package: $bad found in $dir"
              }
            }
          }

          function Assert-Archive([string]$zip) {
            $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            $names = $a.Entries | ForEach-Object { $_.FullName }
            $a.Dispose()
            $outside = $names | Where-Object { -not $_.StartsWith("$folder/") }
            if ($outside) { throw "$zip has entries outside $folder/: $($outside[0])" }
            if ($names -notcontains "$folder/PowerDimmer.exe") { throw "$zip has no $folder/PowerDimmer.exe" }
            $userData = $names | Where-Object { $_ -match '(^|/)(settings\.json|settings\.json\.new|crash\.log)$' }
            if ($userData) { throw "$zip contains user data: $($userData[0])" }
          }

          dotnet publish -c Release -r win-x64 --self-contained true -o "stage-portable/$folder"
          Assert-NoUserData "stage-portable/$folder"
          $portable = "PowerDimmer_$($env:VERSION)_x64-portable.zip"
          Compress-Archive -Path "stage-portable/$folder" -DestinationPath $portable -Force
          Assert-Archive $portable

          dotnet publish -c Release -o "stage-light/$folder"
          Assert-NoUserData "stage-light/$folder"
          $light = "PowerDimmer_$($env:VERSION)_x64-requires-dotnet8.zip"
          Compress-Archive -Path "stage-light/$folder" -DestinationPath $light -Force
          Assert-Archive $light

          "portable_zip=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "light_zip=$light" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The tag is created first, explicitly, and the release is then created
      # against an existing tag. Letting the release API create the tag itself
      # (via target_commitish) returned 403 "Resource not accessible by
      # integration" for every backfilled version.
      - name: Publish release via REST API
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ matrix.version }}
          REF: ${{ matrix.ref }}
          PORTABLE: ${{ steps.pack.outputs.portable_zip }}
          LIGHT: ${{ steps.pack.outputs.light_zip }}
        run: |
          $ErrorActionPreference = "Stop"

          $repo = "${{ github.repository }}"
          $tag = "v$($env:VERSION)"
          $api = "https://api.github.com/repos/$repo"
          $headers = @{
            Authorization          = "Bearer $env:GH_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          function Fail-Call($context, $err) {
            $code = 0
            try { $code = [int]$err.Exception.Response.StatusCode } catch { }
            Write-Host "::error::$context failed (HTTP $code): $($err.ErrorDetails.Message)"
            throw "$context failed (HTTP $code)"
          }

          # --- release notes, straight from CHANGELOG.md -------------------------
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[?v?$([regex]::Escape($env:VERSION))\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "CHANGELOG.md has no '## [$($env:VERSION)]' section" }
          $notes = (($m.Groups[1].Value.Trim() -replace '(?m)^\s*---\s*$', '') -split "`r?`n" | ForEach-Object { $_.TrimEnd() }) -join "`n"
          $notes = $notes.Trim()

          $short = $env:REF.Substring(0, 7)
          $body = @(
            ('> 本版本为补建发布：当时按滚动方式发布，包已被覆盖；这里从对应提交 `' + $short + '` 重新构建。')
            ''
            $notes
            ''
            '---'
            ''
            ('**' + $env:PORTABLE + '** — 自包含，不需要装 .NET。解压后运行 `PowerDimmer\PowerDimmer.exe`。')
            ('**' + $env:LIGHT + '** — 体积小，需要 [.NET 8 桌面运行时](https://dotnet.microsoft.com/en-us/download/dotnet/8.0)。')
          ) -join "`n"

          # --- what can this token actually do? ----------------------------------
          $repoInfo = Invoke-RestMethod -Headers $headers -Uri $api
          Write-Host "repo permissions: $($repoInfo.permissions | ConvertTo-Json -Compress)"
          Write-Host "default_branch: $($repoInfo.default_branch)"

          # --- tag ---------------------------------------------------------------
          $tagExists = $false
          try {
            $existingTag = Invoke-RestMethod -Headers $headers -Uri "$api/git/ref/tags/$tag"
            $tagExists = $true
            Write-Host "tag $tag already exists at $($existingTag.object.sha)"
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { Fail-Call "GET tag $tag" $_ }
          }
          if (-not $tagExists) {
            $payload = @{ ref = "refs/tags/$tag"; sha = $env:REF } | ConvertTo-Json
            try {
              Invoke-RestMethod -Method Post -Headers $headers -Body $payload `
                -ContentType "application/json" -Uri "$api/git/refs" | Out-Null
              $tagExists = $true
              Write-Host "tag $tag created at $env:REF"
            } catch {
              Write-Host "::warning::POST git/refs -> HTTP $([int]$_.Exception.Response.StatusCode) body=[$($_.ErrorDetails.Message)]"
              Write-Host "falling back to implicit tag creation through the release API"
            }
          }

          # --- release -----------------------------------------------------------
          $release = $null
          try {
            $found = Invoke-RestMethod -Headers $headers -Uri "$api/releases/tags/$tag"
            $patch = @{ name = $tag; body = $body } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Patch -Headers $headers -Body $patch `
              -ContentType "application/json" -Uri "$api/releases/$($found.id)"
            Write-Host "release $tag updated (#$($release.id))"
          } catch {
            if ([int]$_.Exception.Response.StatusCode -ne 404) { Fail-Call "GET release $tag" $_ }
            $post = @{
              tag_name   = $tag
              name       = $tag
              body       = $body
              draft      = $false
              prerelease = $false
              # Never let a backfilled version take the "Latest" badge.
              make_latest = 'false'
            }
            if (-not $tagExists) {
              Write-Host "tag missing; letting the release create it at $env:REF"
              $post['target_commitish'] = $env:REF
            }
            $postJson = $post | ConvertTo-Json
            try {
              $release = Invoke-RestMethod -Method Post -Headers $headers -Body $postJson `
                -ContentType "application/json" -Uri "$api/releases"
              Write-Host "release $tag created (#$($release.id))"
            } catch { Fail-Call "POST release $tag" $_ }
          }

          # --- assets ------------------------------------------------------------
          $uploadBase = $release.upload_url -replace '\{\?name,label\}', ''
          $existingAssets = (Invoke-RestMethod -Headers $headers -Uri "$api/releases/$($release.id)/assets").assets

          foreach ($file in @($env:PORTABLE, $env:LIGHT)) {
            if (-not (Test-Path $file)) { throw "missing package: $file" }
            $name = Split-Path $file -Leaf

            $dup = $existingAssets | Where-Object { $_.name -eq $name }
            if ($dup) {
              Write-Host "replacing existing asset $name"
              Invoke-RestMethod -Method Delete -Headers $headers -Uri $dup.url | Out-Null
            }

            $upHeaders = @{
              Authorization  = "Bearer $env:GH_TOKEN"
              "Content-Type" = "application/octet-stream"
            }
            try {
              Invoke-RestMethod -Method Post -Headers $upHeaders -InFile $file `
                -Uri "$uploadBase`?name=$name" | Out-Null
              Write-Host "uploaded $name ($([math]::Round((Get-Item $file).Length / 1MB, 1)) MB)"
            } catch { Fail-Call "upload $name" $_ }
          }

          Write-Host "done: https://github.com/$repo/releases/tag/$tag"
