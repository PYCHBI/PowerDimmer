name: Backfill historical releases

# One-off: versions published before releases became one-per-version only ever
# existed as assets on the rolling "latest" release, so their packages were
# pruned away. This rebuilds each of them from its own commit and publishes it
# as v<version>, so the Releases page keeps a complete, downloadable history.
#
# Keep this file for future use - it is excluded from the main workflow's push
# trigger, so editing it never restarts a release build.

on:
  push:
    paths:
      - ".github/workflows/backfill.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - version: "1.1.0"
            ref: "21e699f3569cdef109bc61e2275ea70dd561c486"
          - version: "1.2.0"
            ref: "796af6ae38764eb29673a1668de1f033aae9ea9f"
          - version: "1.3.0"
            ref: "ac57a517e25a328a8c96b9eb86baa286a1113845"
          - version: "1.3.1"
            ref: "695c6c7dbc58c8f25bb2b4b7ddfb94fa23c0f029"
          - version: "1.4.0"
            ref: "4dc2cd38f90b07534b09ff7a1b70f724d5959978"
          - version: "1.4.1"
            ref: "42ff0f441a54dbc5de97942d77a2bf5fd1a94de2"
          - version: "1.4.2"
            ref: "6cb7c9aa25cdaa8113c15d7423a6e4f8d5c1c4ec"
          - version: "1.5.0"
            ref: "fe26c41d0103906cbfc4d2c62d2e5b115eeb6520"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # The checked-out commit predates CHANGELOG.md, so read it from the branch
      # that has it. Raw content can be a few seconds behind a fresh push.
      - name: Fetch CHANGELOG from the default branch
        shell: pwsh
        run: |
          $url = "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-RestMethod -Uri $url -OutFile CHANGELOG.md
              if ((Get-Item CHANGELOG.md).Length -gt 1000) { break }
            } catch {
              Write-Host "attempt $i failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 6
          }
          if (-not (Test-Path CHANGELOG.md) -or (Get-Item CHANGELOG.md).Length -lt 1000) {
            throw "could not fetch CHANGELOG.md from main"
          }
          Write-Host "CHANGELOG.md: $((Get-Item CHANGELOG.md).Length) bytes"

      # Same packaging rules as the main workflow: one PowerDimmer/ folder whose
      # name carries no version, and no user data inside the archive.
      - name: Build packages
        id: pack
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "PowerDimmer"

          function Assert-NoUserData([string]$dir) {
            foreach ($bad in @("settings.json", "settings.json.new", "crash.log")) {
              if (Test-Path (Join-Path $dir $bad)) {
                throw "Refusing to package: $bad found in $dir"
              }
            }
          }

          function Assert-Archive([string]$zip) {
            $a = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
            $names = $a.Entries | ForEach-Object { $_.FullName }
            $a.Dispose()
            $outside = $names | Where-Object { -not $_.StartsWith("$folder/") }
            if ($outside) { throw "$zip has entries outside $folder/: $($outside[0])" }
            if ($names -notcontains "$folder/PowerDimmer.exe") { throw "$zip has no $folder/PowerDimmer.exe" }
            $userData = $names | Where-Object { $_ -match '(^|/)(settings\.json|settings\.json\.new|crash\.log)$' }
            if ($userData) { throw "$zip contains user data: $($userData[0])" }
          }

          dotnet publish -c Release -r win-x64 --self-contained true -o "stage-portable/$folder"
          Assert-NoUserData "stage-portable/$folder"
          $portable = "PowerDimmer_$($env:VERSION)_x64-portable.zip"
          Compress-Archive -Path "stage-portable/$folder" -DestinationPath $portable -Force
          Assert-Archive $portable

          dotnet publish -c Release -o "stage-light/$folder"
          Assert-NoUserData "stage-light/$folder"
          $light = "PowerDimmer_$($env:VERSION)_x64-requires-dotnet8.zip"
          Compress-Archive -Path "stage-light/$folder" -DestinationPath $light -Force
          Assert-Archive $light

          "portable_zip=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "light_zip=$light" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Extract release notes from CHANGELOG.md
        id: notes
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^##\s+\[?v?$([regex]::Escape($env:VERSION))\]?[^\r\n]*\r?\n(.*?)(?=^##\s|\z)"
          $m = [regex]::Match($text, $pattern)
          if (-not $m.Success) { throw "CHANGELOG.md has no '## [$env:VERSION]' section." }
          $notes = $m.Groups[1].Value.Trim()
          "notes<<CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $notes | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "CHANGELOG_EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ matrix.version }}
          name: v${{ matrix.version }}
          target_commitish: ${{ matrix.ref }}
          # A backfilled release must never take the "Latest" badge away from the
          # newest version.
          make_latest: "false"
          body: |
            > 本版本为补建发布：当时按滚动方式发布，包已被覆盖；这里从对应提交 `${{ matrix.ref }}` 重新构建。

            ${{ steps.notes.outputs.notes }}

            ---

            **${{ steps.pack.outputs.portable_zip }}** — 自包含，不需要装 .NET。解压后运行 `PowerDimmer\PowerDimmer.exe`。
            **${{ steps.pack.outputs.light_zip }}** — 体积小，需要 [.NET 8 桌面运行时](https://dotnet.microsoft.com/en-us/download/dotnet/8.0)。
          files: |
            ${{ steps.pack.outputs.portable_zip }}
            ${{ steps.pack.outputs.light_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
